<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#172033}.t{font-size:23px;font-weight:700}.s{font-size:17px}.xs{font-size:14px;fill:#475569}.box{stroke:#334155;stroke-width:2;rx:14}.arr{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1500" height="760" fill="#f8fafc"/>
  <text x="750" y="48" text-anchor="middle" class="t" font-size="30">Phase 1：三尺度早期融合 DeepLabV3 上限对照</text>
  <text x="750" y="76" text-anchor="middle" class="xs">同一中心 · 动态读取 · 10× GT 监督 · 10×/5×/2.5× 各缩放为 512×512</text>
  <rect x="55" y="125" width="250" height="510" class="box" fill="#e0f2fe"/><text x="180" y="162" text-anchor="middle" class="t">同一 WSI 中心</text><text x="180" y="190" text-anchor="middle" class="s">level-0 坐标</text>
  <rect x="82" y="225" width="196" height="84" class="box" fill="#bae6fd"/><text x="180" y="257" text-anchor="middle" class="t">10× Fine</text><text x="180" y="285" text-anchor="middle" class="xs">1024² level-0 → 512² RGB</text>
  <rect x="82" y="350" width="196" height="84" class="box" fill="#bae6fd"/><text x="180" y="382" text-anchor="middle" class="t">5× Middle</text><text x="180" y="410" text-anchor="middle" class="xs">2048² level-0 → 512² RGB</text>
  <rect x="82" y="475" width="196" height="84" class="box" fill="#bae6fd"/><text x="180" y="507" text-anchor="middle" class="t">2.5× Coarse</text><text x="180" y="535" text-anchor="middle" class="xs">4096² level-0 → 512² RGB</text>
  <path d="M305 267H420" class="arr"/><path d="M305 392H420" class="arr"/><path d="M305 517H420" class="arr"/>
  <rect x="430" y="215" width="275" height="355" class="box" fill="#fef3c7"/><text x="568" y="255" text-anchor="middle" class="t">尺度归一化与拼接</text><text x="568" y="290" text-anchor="middle" class="s">ImageNet normalize</text><text x="568" y="325" text-anchor="middle" class="s">Concat on channel axis</text><rect x="475" y="370" width="185" height="80" rx="10" fill="#fbbf24"/><text x="568" y="403" text-anchor="middle" class="t">9 × 512 × 512</text><text x="568" y="431" text-anchor="middle" class="xs">[10× RGB | 5× RGB | 2.5× RGB]</text><text x="568" y="505" text-anchor="middle" class="xs">对照：3 通道或 6 通道</text>
  <path d="M705 392H815" class="arr"/>
  <rect x="825" y="215" width="300" height="355" class="box" fill="#ede9fe"/><text x="975" y="255" text-anchor="middle" class="t">DeepLabV3-ResNet50</text><text x="975" y="292" text-anchor="middle" class="s">9-channel conv1</text><text x="975" y="322" text-anchor="middle" class="xs">3-channel COCO 权重复制并均分初始化</text><rect x="865" y="360" width="220" height="58" rx="9" fill="#c4b5fd"/><text x="975" y="397" text-anchor="middle" class="s">ResNet50 backbone + ASPP</text><rect x="865" y="455" width="220" height="58" rx="9" fill="#c4b5fd"/><text x="975" y="492" text-anchor="middle" class="s">12-class segmentation head</text>
  <path d="M1125 392H1235" class="arr"/>
  <rect x="1245" y="245" width="200" height="295" class="box" fill="#dcfce7"/><text x="1345" y="286" text-anchor="middle" class="t">像素预测</text><text x="1345" y="320" text-anchor="middle" class="s">12 × 512 × 512 logits</text><rect x="1280" y="365" width="130" height="58" rx="9" fill="#86efac"/><text x="1345" y="402" text-anchor="middle" class="s">CE + Dice</text><text x="1345" y="468" text-anchor="middle" class="xs">10× GT mask</text>
  <path d="M1345 540V640H720" class="arr"/><rect x="465" y="620" width="250" height="80" class="box" fill="#fee2e2"/><text x="590" y="654" text-anchor="middle" class="t">训练/验证协议</text><text x="590" y="682" text-anchor="middle" class="xs">同一 cohort、索引、预算与指标</text>
  <text x="800" y="684" class="s">公平比较：10× only → 10×+5× → 10×+5×+2.5×</text>
</svg>
